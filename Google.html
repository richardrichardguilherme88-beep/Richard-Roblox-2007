<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Scratch 3D — 8 Jogos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0e1a;font-family:'Segoe UI',Arial,sans-serif;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ============ CONTROLES DO JOGO ============ */
#ui{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;z-index:20}
#ui.show{opacity:1}
.btn{pointer-events:auto;position:absolute;width:68px;height:68px;border-radius:18px;border:3px solid #fff8;
background:linear-gradient(#62d7ff,#1976d2);color:white;font-size:28px;font-weight:bold;
box-shadow:0 7px 0 #0d477f,0 10px 18px #0008;touch-action:none;
display:flex;align-items:center;justify-content:center}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 #0d477f,0 4px 10px #0008}
#up{left:88px;bottom:145px} #left{left:15px;bottom:72px} #down{left:88px;bottom:72px}
#right{left:161px;bottom:72px}
#jump{right:25px;bottom:100px;background:linear-gradient(#ffce54,#e67e00);
box-shadow:0 7px 0 #8a4a00,0 10px 18px #0008}
#camL{right:140px;bottom:20px;width:52px;height:52px;font-size:22px;
background:linear-gradient(#a0aec0,#4a5568);box-shadow:0 6px 0 #2d3748,0 9px 15px #0008}
#camR{right:25px;bottom:20px;width:52px;height:52px;font-size:22px;
background:linear-gradient(#a0aec0,#4a5568);box-shadow:0 6px 0 #2d3748,0 9px 15px #0008}

/* ============ HUD ============ */
#hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;
justify-content:space-between;pointer-events:none;color:#fff;font-weight:bold;
text-shadow:2px 2px 4px #000a;z-index:10;opacity:0;transition:opacity .3s}
#hud.show{opacity:1}
.hud-box{background:#0006;border:2px solid #fff4;border-radius:12px;padding:6px 14px;backdrop-filter:blur(6px)}
#score{font-size:18px}#lives{font-size:18px;letter-spacing:2px}
#levelName{position:absolute;top:12px;left:50%;transform:translateX(-50%);
color:#fff;font-size:16px;font-weight:bold;text-shadow:2px 2px 4px #000a;
background:#0006;border:2px solid #fff4;border-radius:12px;padding:6px 18px;
backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
#levelName.show{opacity:1}

/* ============ BOTÃO VOLTAR (dentro do jogo) ============ */
#backBtn{position:fixed;top:12px;left:14px;z-index:30;pointer-events:auto;
padding:8px 16px;font-size:14px;font-weight:bold;color:#fff;
background:#0008;border:2px solid #fff4;border-radius:10px;
backdrop-filter:blur(6px);cursor:pointer;display:none}
#backBtn.show{display:block}
#backBtn:hover{background:#000c}

/* ============ MENU DE SELEÇÃO ============ */
#menu{position:fixed;inset:0;z-index:100;color:#fff;overflow:hidden;
background:radial-gradient(ellipse at 50% 0%, #2a4a7a 0%, transparent 60%),
           radial-gradient(ellipse at 50% 100%, #1a2a4a 0%, transparent 70%),
           linear-gradient(180deg, #0f1b33 0%, #060a15 100%);
transition:opacity .4s,transform .4s}
#menu.hidden{opacity:0;pointer-events:none;transform:scale(1.05)}
#menu::before{content:'';position:absolute;inset:0;
background-image:
  radial-gradient(2px 2px at 20% 30%, #fff8, transparent),
  radial-gradient(2px 2px at 60% 20%, #fff6, transparent),
  radial-gradient(1px 1px at 80% 60%, #fff8, transparent),
  radial-gradient(1px 1px at 30% 70%, #fff6, transparent),
  radial-gradient(2px 2px at 90% 40%, #fff5, transparent),
  radial-gradient(1px 1px at 45% 85%, #fff7, transparent);
animation:twinkle 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}

.menu-header{position:absolute;top:20px;left:0;right:0;text-align:center;z-index:2}
.menu-header h1{font-size:44px;font-weight:900;letter-spacing:4px;line-height:1;
background:linear-gradient(180deg,#fff5b8 0%, #ffd54f 45%, #ff9800 55%, #e65100 100%);
-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 4px 0 #7a3d00) drop-shadow(0 8px 18px #000a);
animation:titleFloat 3s ease-in-out infinite}
.menu-header p{font-size:13px;letter-spacing:6px;color:#90caf9;font-weight:600;
text-shadow:0 2px 8px #2196f3aa;text-transform:uppercase;margin-top:6px}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Grid de jogos */
.games-grid{position:absolute;top:130px;bottom:140px;left:20px;right:20px;
display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
gap:14px;z-index:2}
.game-card{background:linear-gradient(180deg,#ffffff14,#ffffff06);
border:2px solid #ffffff1f;border-radius:18px;cursor:pointer;
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:10px;position:relative;overflow:hidden;
transition:all .2s ease;backdrop-filter:blur(8px)}
.game-card:hover{transform:translateY(-4px);border-color:#ffffff55;background:linear-gradient(180deg,#ffffff22,#ffffff0c)}
.game-card.selected{
  border-color:#ffd54f;
  background:linear-gradient(180deg,#ffd54f33,#ff980011);
  box-shadow:0 0 0 3px #ffd54f55, 0 10px 30px #ff980066;
  transform:translateY(-6px) scale(1.02)}
.game-card.selected::after{
  content:'';position:absolute;inset:-2px;border-radius:18px;
  background:linear-gradient(45deg,transparent,#ffd54f88,transparent);
  animation:shine 2.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,100%{opacity:0}50%{opacity:1}}
.game-icon{font-size:42px;margin-bottom:6px;
filter:drop-shadow(0 4px 8px #000a)}
.game-name{font-size:14px;font-weight:800;color:#fff;text-align:center;
letter-spacing:1px;text-shadow:1px 1px 3px #000a;line-height:1.15}
.game-sub{font-size:10px;color:#90a4ae;margin-top:3px;text-align:center;letter-spacing:.5px}

/* Rodapé do menu */
.menu-footer{position:absolute;bottom:0;left:0;right:0;padding:16px 24px;
display:flex;align-items:center;justify-content:space-between;z-index:2;
background:linear-gradient(0deg,#000a,transparent)}
.menu-info{color:#90a4ae;font-size:13px;max-width:60%}
.menu-info b{color:#ffd54f}
.menu-play{padding:14px 44px;font-size:20px;font-weight:900;letter-spacing:2px;
border:none;border-radius:16px;cursor:pointer;color:#fff;
background:linear-gradient(180deg,#66bb6a,#2e7d32);
box-shadow:0 8px 0 #1b5e20,0 12px 24px #000a,inset 0 2px 0 #ffffff55;
text-shadow:0 2px 4px #000a;transition:transform .1s;
display:flex;align-items:center;gap:10px}
.menu-play:active{transform:translateY(6px);box-shadow:0 2px 0 #1b5e20,0 4px 10px #000a}
.menu-play .play-icon{display:inline-block;width:0;height:0;
border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}

/* Setas de navegação (mobile) */
.nav-arrows{position:absolute;bottom:200px;left:0;right:0;
display:flex;justify-content:space-between;padding:0 14px;pointer-events:none;z-index:3}
.nav-arrow{pointer-events:auto;width:46px;height:46px;border-radius:50%;
background:#ffffff20;border:2px solid #ffffff44;color:#fff;font-size:20px;
display:flex;align-items:center;justify-content:center;cursor:pointer;
backdrop-filter:blur(6px);transition:all .15s}
.nav-arrow:hover{background:#ffffff44}
.nav-arrow:active{transform:scale(.9)}
@media(min-width:800px){.nav-arrows{display:none}}

/* Tela de fim (game over / win) */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;color:#fff;text-align:center;z-index:150;padding:20px;
transition:opacity .4s,transform .4s;background:radial-gradient(circle at 50% 40%,#2a3f6e,#0d1421 80%)}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(1.05)}
.screen h1{font-size:48px;margin-bottom:8px;letter-spacing:3px;filter:drop-shadow(0 4px 12px #000a)}
.screen h2{font-size:24px;margin-bottom:22px;color:#ffd54f;text-shadow:2px 2px 6px #000a}
.screen p{font-size:16px;color:#b0bec5;margin-bottom:10px;max-width:460px}
.btn-main{margin-top:20px;padding:14px 40px;font-size:20px;font-weight:bold;
border:none;border-radius:14px;cursor:pointer;color:#fff;
background:linear-gradient(#66bb6a,#2e7d32);box-shadow:0 7px 0 #1b5e20,0 12px 24px #000a;transition:transform .1s}
.btn-main:active{transform:translateY(5px);box-shadow:0 2px 0 #1b5e20,0 6px 14px #000a}
.btn-sec{margin-top:10px;padding:10px 30px;font-size:15px;font-weight:bold;
border:3px solid #fff5;border-radius:12px;cursor:pointer;color:#fff;background:#ffffff14}
.btn-sec:hover{background:#ffffff28}

/* Transição */
#transition{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
background:#0a0e1a;color:#fff;font-size:32px;font-weight:900;letter-spacing:3px;
z-index:200;pointer-events:none;opacity:0;transition:opacity .35s;text-shadow:0 0 40px #ffd54faa}
#transition.show{opacity:1}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-box" id="lives">❤️❤️❤️</div>
  <div class="hud-box" id="score">🪙 0 / 0</div>
</div>
<div id="levelName">FASE 1</div>
<button id="backBtn">◀ MENU</button>

<div id="ui">
  <button class="btn" id="up">▲</button>
  <button class="btn" id="left">◀</button>
  <button class="btn" id="down">▼</button>
  <button class="btn" id="right">▶</button>
  <button class="btn" id="jump">⬆</button>
  <button class="btn" id="camL">↺</button>
  <button class="btn" id="camR">↻</button>
</div>

<!-- ============ MENU PRINCIPAL ============ -->
<div id="menu">
  <div class="menu-header">
    <h1>RICHARD PLAY BETA</h1>
    <p>8 jogos em um ★ escolha o seu</p>
  </div>

  <div class="games-grid" id="gamesGrid"></div>

  <div class="nav-arrows">
    <div class="nav-arrow" id="navL">◀</div>
    <div class="nav-arrow" id="navR">▶</div>
  </div>

  <div class="menu-footer">
    <div class="menu-info" id="menuInfo">
      Use <b>← →</b> e <b>Enter</b> para escolher
    </div>
    <button class="menu-play" id="playBtn"><span class="play-icon"></span>JOGAR</button>
  </div>
</div>

<!-- Fim de jogo -->
<div class="screen hidden" id="gameover">
  <h1 id="goTitle">💀 FIM DE JOGO</h1>
  <h2 id="goScore">Pontuação: 0</h2>
  <button class="btn-main" id="retryBtn">↻ TENTAR NOVAMENTE</button>
  <button class="btn-sec" id="menuBtn">🏠 MENU</button>
</div>

<div id="transition">CARREGANDO</div>

<script>
/* =====================================================================
   SCRATCH 3D — 8 Jogos
   ===================================================================== */
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

const STATE={MENU:0,PLAY:1,DEAD:2,WIN:3};
let state=STATE.MENU;
let currentGameIdx=0;

/* ---------- ÁUDIO ---------- */
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
function beep(f,d,t='sine',v=0.06){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(v,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+d);
}
const SFX={
  jump:()=>beep(520,0.12,'square',0.05),
  coin:()=>{beep(880,0.08);setTimeout(()=>beep(1320,0.1),60)},
  hurt:()=>beep(140,0.3,'sawtooth',0.09),
  land:()=>beep(180,0.06,'triangle',0.04),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.15),i*110)),
  portal:()=>[400,600,900].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'sine',0.07),i*90)),
  select:()=>beep(660,0.06,'sine',0.04),
  click:()=>beep(880,0.08,'square',0.05)
};

/* ---------- HELPERS ---------- */
function rotate(x,z,a){const ca=Math.cos(a),sa=Math.sin(a);return{x:x*ca-z*sa,z:x*sa+z*ca}}

const cam={angle:0,targetAngle:0,dist:7.5,height:4.2};
const player={x:0,z:0,y:0,vy:0,radius:0.35,onGround:true,facing:0,animTime:0,squash:0,hurtTimer:0};

let world=null,particles=[],popups=[];
let score=0,lives=3;
const keys={};

function project(wx,wy,wz){
  const dx=wx-player.x,dz=wz-player.z;
  const r=rotate(dx,dz,-cam.angle);
  const zz=r.z+cam.dist;
  if(zz<0.5)return null;
  const f=480,s=f/zz;
  return {x:W/2+r.x*s, y:H*0.55+(cam.height-wy)*s, s, z:zz};
}

/* ---------- CRIA O GRID DO MENU ---------- */
const grid=document.getElementById('gamesGrid');
let selectedIdx=0;
GAMES.forEach((g,i)=>{
  const el=document.createElement('div');
  el.className='game-card';
  el.innerHTML=`<div class="game-icon">${g.icon}</div>
    <div class="game-name">${g.name}</div>
    <div class="game-sub">${g.sub}</div>`;
  el.addEventListener('click',()=>{selectedIdx=i;SFX.click();renderMenuSelection();launchGame();});
  el.addEventListener('pointerenter',()=>{selectedIdx=i;renderMenuSelection();SFX.select();});
  grid.appendChild(el);
});
function renderMenuSelection(){
  const cards=grid.querySelectorAll('.game-card');
  cards.forEach((c,i)=>c.classList.toggle('selected', i===selectedIdx));
  document.getElementById('menuInfo').innerHTML=GAMES[selectedIdx].info+
    '<br><span style="opacity:.6;font-size:11px">← → para navegar · Enter para jogar</span>';
}
renderMenuSelection();
